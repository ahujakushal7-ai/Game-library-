[package]
name = "game-library"
version = "0.1.0"
description = "Cross-platform game launcher and aggregator"
authors = ["you"]
edition = "2021"

[lib]
name = "game_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
